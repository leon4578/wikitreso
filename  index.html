<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WikiTrésor</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--cd:#fff;--mu:#6b6b66;--ln:#dcdad2;--ac:#2f5fd0;--r0:#8a8f98;--r1:#2f86d0;--r2:#9b4fd0;--r3:#e0a020;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--fg:#ecebe6;--cd:#222228;--mu:#9a9a94;--ln:#35353d;--ac:#7ba0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--fg:#ecebe6;--cd:#222228;--mu:#9a9a94;--ln:#35353d;--ac:#7ba0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(120,100,230,.25),transparent),var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}h1{font-size:23px;margin:0;background:linear-gradient(90deg,#6a5cff,#d85fd8,#f0a020);-webkit-background-clip:text;background-clip:text;color:transparent}
.wb{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-weight:600}
main{padding:0 14px 14px;max-width:760px;margin:auto}h2{font-size:16px;margin:16px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.c{--a:#b9bec7;--b:#e4e7ec;--t:#23262b;position:relative;aspect-ratio:2/3.1;display:flex;flex-direction:column;border-radius:14px;border:3px solid #fff6dd;background:#fff;color:var(--t);overflow:hidden;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}
.c:hover{transform:translateY(-3px) scale(1.02)}.c.nw{animation:pop .5s both;animation-delay:var(--d,0s)}
.c h3{margin:0;padding:7px 8px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;background:linear-gradient(135deg,var(--a),var(--b))}
.im{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:50px;background:radial-gradient(circle at 50% 40%,#fff,var(--b) 150%) center/cover}.im.ph{font-size:0}
.ds{padding:6px 8px;font-size:11px;line-height:1.25;background:linear-gradient(180deg,var(--b),var(--a));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.3em}
.rl{padding:6px;text-align:center;font-weight:800;font-size:13px;border-top:2px solid rgba(255,255,255,.6);background:linear-gradient(180deg,var(--a),var(--b))}
.bd{position:absolute;top:34px;right:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;z-index:2}
.c.r1{--a:#5b9be6;--b:#a8d1ff;--t:#0a1d3a}.c.r2{--a:#a56ae0;--b:#dcb8ff;--t:#2a0b4a;box-shadow:0 0 16px rgba(165,106,224,.75)}
.c.r3{--a:#d9a02a;--b:#f7e08a;--t:#2b1c05;border-color:#fff1b8;box-shadow:0 0 22px rgba(240,190,60,.9)}
.c.r3::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);animation:sh 2.6s infinite;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}@keyframes sh{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.hero{background:linear-gradient(135deg,#3b4fd8,#8a4fd8);color:#fff;border:0}.hero .mu{color:#e5e0ff}.hero button{background:#fff;color:#3b2fa0;font-weight:700;font-size:16px;padding:12px 18px}



button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}button.s{background:var(--cd);color:var(--fg);border:1px solid var(--ln)}button:disabled{opacity:.45}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);max-width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:11px}nav button.on{color:var(--ac);font-weight:700}
#sheet{max-height:82vh;overflow:auto;position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:9;display:none;max-width:90%;text-align:center}
a{color:var(--ac)}.mu{color:var(--mu);font-size:12px}.opt{display:block;width:100%;margin:6px 0;text-align:left}
</style></head><body>
<header><h1>💎 WikiTrésor</h1><span class="wb" id="wb"></span></header>
<main id="app"></main><div id="sheet"></div><div id="toast"></div>
<nav id="nav"></nav>
<style>.c.nm .ds{flex:1;-webkit-line-clamp:9;font-size:12px}.c.nm .ds b{display:block;margin-bottom:4px}.rl small{display:block;font-weight:500;font-size:10px}.im{background-color:#fff}</style>
<script>
const RN=['Banale','Précieuse','Éclatante','Mythique'],BASE=[3,15,60,250],PTS=[1,3,10,40],TH=[1000,10000,60000];
const rar=v=>v<TH[0]?0:v<TH[1]?1:v<TH[2]?2:3;
let S={wb:50,col:{},fav:[],vit:[],packs:3,next:Date.now()+6e5,sold:0,wins:0,ach:[],last:[]};
try{const j=localStorage.getItem('wt');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}
let T='boost',F={q:'',r:'',f:''},M=null,ml=false,Q=null,Nw=false,busy=false;
const $=s=>document.querySelector(s),sv=()=>{try{localStorage.setItem('wt',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const all=()=>Object.values(S.col),tot=()=>all().reduce((a,c)=>a+c.n,0),cr=r=>all().reduce((a,c)=>a+(c.r==r?c.n:0),0),pts=()=>all().reduce((a,c)=>a+c.n*PTS[c.r],0)+S.wins*10;
const rnd=a=>a[Math.random()*a.length|0],shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const fmt=v=>v>=1e6?(v/1e6).toFixed(1)+' M':v>=1e3?Math.round(v/1e3)+' k':v;
const add=c=>{S.col[c.id]?S.col[c.id].n++:S.col[c.id]=Object.assign({n:1},c)};
function take(id){const c=S.col[id];if(--c.n<1){delete S.col[id];S.fav=S.fav.filter(x=>x!=id);S.vit=S.vit.filter(x=>x!=id)}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
const bad=()=>toast('Wikipédia injoignable : ouvre ce fichier dans un vrai navigateur ou héberge-le (pas dans l’aperçu claude.ai).');
async function rand(k){const u='https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnfilterredir=nonredirects&grnlimit='+k+'&prop=pageimages|extracts|pageviews|description&piprop=thumbnail&pithumbsize=420&exintro=1&explaintext=1&exsentences=2&exlimit=max&pvipdays=30';
const j=await(await fetch(u)).json();return Object.values(j.query.pages).map(p=>{const v=Object.values(p.pageviews||{}).reduce((a,b)=>a+(b||0),0);return{id:String(p.pageid),t:p.title,d:p.description||'',x:(p.extract||'').trim(),i:p.thumbnail?p.thumbnail.source.replace(/'/g,'%27'):'',v,r:rar(v)}})}
function tick(){const n=Date.now();while(n>=S.next&&S.packs<10){S.packs++;S.next+=6e5}if(S.packs>=10)S.next=n+6e5}
const A=[['Apprenti','Posséder 50 cartes',()=>tot()>=50,10],['Curieux','Posséder 100 cartes',()=>tot()>=100,15],['Chineur','Posséder 250 cartes',()=>tot()>=250,25],['Érudit','Posséder 500 cartes',()=>tot()>=500,40],['Coups de cœur','10 cartes en favoris',()=>S.fav.length>=10,25],['Chasseur d’éclatantes','Posséder 10 cartes Éclatante',()=>cr(2)>=10,100],['Reliques','Posséder 1 carte Mythique',()=>cr(3)>=1,250],['Marchand','Vendre 3 cartes en bourse',()=>S.sold>=3,50],['WikiComptoir','Vendre 50 cartes en bourse',()=>S.sold>=50,200],['Première joute gagnée','Gagner une joute',()=>S.wins>=1,20]];
function chk(){A.forEach((a,i)=>{if(!S.ach.includes(i)&&a[2]()){S.ach.push(i);S.wb+=a[3];toast('🏆 '+a[0]+' +'+a[3]+' pépites')}})}
const card=(c,n,d)=>`<div class="c r${c.r}${c.i?'':' nm'}${d!=null?' nw':''}" ${d!=null?`style="--d:${d}s"`:''} data-i="${c.id}">${n>1?`<span class="bd">×${n}</span>`:''}<h3>${esc(c.t)}${S.fav.includes(c.id)?' ♥':''}</h3>${c.i?`<div class="im" style="background-image:url('${c.i}');background-position:center 20%"></div><div class="ds">${esc(c.d||c.x||'Aucune description')}</div>`:`<div class="ds">${c.d?`<b>${esc(c.d)}</b>`:''}${esc(c.x||(c.d?'':'Aucune description'))}</div>`}<div class="rl">${RN[c.r]}<small>${fmt(c.v)} visites / 30 j</small></div></div>`;
const V={
boost(){const s=Math.max(0,Math.ceil((S.next-Date.now())/1e3));return`<div class="box hero"><div class="row"><div><b id="pk" style="font-size:18px">${S.packs}/10 pochettes</b><div class="mu">5 articles Wikipédia au hasard toutes les 10 min (cumul jusqu’à 10).${S.packs<10?' Prochaine dans <span id="tm">'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</span>':''}</div></div><button data-a="open" ${S.packs&&!busy?'':'disabled'}>${busy?'Ouverture…':'Ouvrir la pochette'}</button></div></div>`+(S.last.some(i=>S.col[i])?`<h2>Dernier tirage</h2><div class="g">${S.last.filter(i=>S.col[i]).map((i,k)=>card(S.col[i],1,Nw?k*.28:null)).join('')}</div>`:'')+`<div class="box mu" style="margin-top:12px">Rareté = visites de l’article sur Wikipédia (30 derniers jours) : Banale &lt; 1 000 · Précieuse &lt; 10 000 · Éclatante &lt; 60 000 · Mythique ≥ 60 000. L’image est celle de l’article, s’il en a une.</div>`},
album(){const q=F.q.toLowerCase(),L=all().filter(c=>(!q||c.t.toLowerCase().includes(q))&&(F.r===''||c.r==F.r)&&(!F.f||S.fav.includes(c.id))).sort((a,b)=>b.r-a.r||b.v-a.v);
return`<div class="box"><b>Ma galerie</b> <span class="mu">(max 6)</span>${S.vit.length?`<div class="g" style="margin-top:8px">${S.vit.filter(i=>S.col[i]).map(i=>card(S.col[i],1)).join('')}</div>`:'<div class="mu">Ajoute des cartes depuis leur fiche.</div>'}</div><div class="row" style="margin:8px 0"><input id="q" placeholder="Rechercher" value="${esc(F.q)}"><select id="fr"><option value="">Toutes raretés</option>${RN.map((n,i)=>`<option value="${i}" ${F.r!==''&&F.r==i?'selected':''}>${n}</option>`).join('')}</select><label><input type="checkbox" id="ff" ${F.f?'checked':''}> ♥</label></div><div class="mu">${all().length} cartes uniques · ${tot()} au total</div><div class="g" style="margin-top:8px">${L.slice(0,150).map(c=>card(c,c.n)).join('')||'<div class="mu">Aucune carte.</div>'}</div>`},
market(){if(M===null&&!ml){ml=true;rand(6).then(L=>{M=L.map(c=>({c,p:Math.round(BASE[c.r]*(.7+Math.random()*.8))||2,s:rnd(['Hermione_92','MaîtreLoutre','Cléo','Pixel','Sarrasin42'])}))}).catch(()=>{M=[];bad()}).finally(()=>{ml=false;render()})}
return`<div class="row"><h2>Bourse aux trésors</h2><button class="s" data-a="gen">Actualiser</button></div>`+(M===null?'<div class="mu">Chargement…</div>':M.map((m,k)=>{const c=m.c;return`<div class="box row"><div style="display:flex;gap:10px;align-items:center">${c.i?`<img src="${c.i}" width="46" height="46" alt="" style="object-fit:cover;border-radius:8px">`:''}<div><b>${esc(c.t)}</b><div class="mu">${RN[c.r]} · ${fmt(c.v)} visites · ${m.s}</div></div></div><button data-a="buy" data-k="${k}" ${S.wb>=m.p?'':'disabled'}>${m.p} ₩</button></div>`}).join(''))+`<div class="mu">Pour vendre, ouvre une carte de ta collection puis « Vendre ».</div>`},
duel(){if(!Q)return`<div class="box"><b>Joute du savoir</b><div class="mu">5 questions tirées de tes cartes : retrouve l’article. Victoire : +20 ₩.</div><p><button data-a="duel" ${tot()&&!busy?'':'disabled'}>Lancer une joute</button></p>${tot()?'':'<div class="mu">Ouvre une pochette d’abord.</div>'}</div>`;
if(Q.i>=Q.qs.length){const w=Q.sc>Q.bs;return`<div class="box"><b>${w?'🎉 Victoire !':Q.sc==Q.bs?'Égalité':'Défaite'}</b><p>Toi ${Q.sc} – ${Q.bs} Adversaire${w?' · +20 ₩':''}</p><button data-a="duelend">Fermer</button></div>`}
const q=Q.qs[Q.i];return`<div class="box"><div class="mu">Question ${Q.i+1}/${Q.qs.length} · ${Q.sc}–${Q.bs}</div><p><b>De quel article s’agit-il ?</b><br>${esc(q.x)}</p>${q.o.map(o=>`<button class="s opt" data-a="ans" data-v="${o.id}">${esc(o.t)}</button>`).join('')}</div>`},
succ(){return`<h2>Exploits (${S.ach.length}/${A.length})</h2>`+A.map((a,i)=>`<div class="box row"><div>${S.ach.includes(i)?'✅':'🔒'} <b>${a[0]}</b><div class="mu">${a[1]}</div></div><b>+${a[3]} ₩</b></div>`).join('')},
rank(){const L=[['Hermione_92',1840],['MaîtreLoutre',1260],['Cléo',930],['Sarrasin42',410],['Pixel',150],['Toi',pts()]].sort((a,b)=>b[1]-a[1]);return`<h2>Classement</h2>`+L.map((l,i)=>`<div class="box row" ${l[0]=='Toi'?'style="border-color:var(--ac)"':''}><span>${i+1}. <b>${l[0]}</b></span><span>${l[1]} pts</span></div>`).join('')+`<div class="mu">Points : rareté de tes cartes + victoires en joute. Les autres joueurs sont simulés.</div>`}};
const TABS=[['boost','🎁','Pochettes'],['album','📚','Collection'],['market','🏷️','Bourse'],['duel','⚔️','Joutes'],['succ','🏆','Exploits'],['rank','📊','Rang']];
function render(){chk();$('#wb').textContent='💰 '+S.wb+' pépites';$('#nav').innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" data-t="${t[0]}">${t[1]}<br>${t[2]}</button>`).join('');
const a=document.activeElement&&document.activeElement.id;$('#app').innerHTML=V[T]()+`<p class="mu">Articles et images : Wikipédia / Wikimedia Commons (licences libres, CC BY-SA). Projet fan non officiel.</p>`;if(a=='q'){const e=$('#q');e.focus();e.setSelectionRange(99,99)}Nw=false;sv()}
function sheet(id){const sh=$('#sheet'),c=id==null?null:S.col[id];if(!c){sh.style.display='none';return}sh.style.display='block';
sh.innerHTML=`<div style="display:flex;gap:14px"><div style="width:150px;flex:none">${card(c,c.n)}</div><div><div class="mu">${RN[c.r]} · ${c.v.toLocaleString('fr-FR')} visites / 30 j · ×${c.n}</div><p style="margin:6px 0">${esc(c.x||c.d)}</p><a href="https://fr.wikipedia.org/?curid=${c.id}" target="_blank" rel="noopener">Lire sur Wikipédia (CC BY-SA)</a><div class="row" style="margin-top:10px"><button class="s" data-a="fav" data-i="${id}">${S.fav.includes(id)?'♥ Retirer':'♡ Favori'}</button><button class="s" data-a="vit" data-i="${id}">🖼️ Galerie</button><button class="s" data-a="disc" data-i="${id}">🗑️ +1 ₩</button><button data-a="sell" data-i="${id}">🏷️ Vendre</button></div></div></div><p><button class="s" data-a="close">Fermer</button></p>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){T=t.dataset.t;sheet();return render()}
const a=e.target.closest('[data-a]');if(a){const k=a.dataset.a,i=a.dataset.i;
if(k=='open'){tick();if(!S.packs||busy)return;busy=true;render();rand(5).then(L=>{S.packs--;Nw=true;S.last=L.map(c=>{add(c);return c.id})}).catch(bad).finally(()=>{busy=false;render()});return}
if(k=='duel'){const own=shuf(all().filter(c=>c.x||c.d));if(!own.length||busy)return;busy=true;(async()=>{let pool=own.slice();if(pool.length<4){try{pool=pool.concat(await rand(8))}catch(e){}}
const mk=c=>(c.x||c.d).replace(new RegExp(c.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'___');
Q={i:0,sc:0,bs:0,qs:own.slice(0,5).map(c=>({x:mk(c),a:c.id,o:shuf([c,...shuf(pool.filter(p=>p.id!=c.id)).slice(0,3)]).map(p=>({id:p.id,t:p.t}))}))}})().finally(()=>{busy=false;render()});return}
if(k=='fav'){S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];sheet(i)}
else if(k=='vit'){if(S.vit.includes(i))S.vit=S.vit.filter(x=>x!=i);else if(S.vit.length<6)S.vit.push(i);else toast('Galerie pleine');sheet(i)}
else if(k=='disc'){take(i);S.wb+=1;sheet(S.col[i]?i:null)}
else if(k=='sell'){const c=S.col[i],p=Math.max(1,Math.round(BASE[c.r]*(.6+Math.random())));take(i);toast('🏷️ '+c.t+' mise en vente…');setTimeout(()=>{S.wb+=p;S.sold++;toast('Vendue '+p+' ₩ !');render()},5000);sheet(S.col[i]?i:null)}
else if(k=='close')sheet();
else if(k=='gen')M=null;
else if(k=='buy'){const m=M[+a.dataset.k];if(S.wb<m.p)return;S.wb-=m.p;add(m.c);M.splice(+a.dataset.k,1);toast('Carte achetée !')}
else if(k=='ans'){const q=Q.qs[Q.i];if(a.dataset.v==q.a)Q.sc++;if(Math.random()<.6)Q.bs++;Q.i++;if(Q.i>=Q.qs.length){if(Q.sc>Q.bs){S.wb+=20;S.wins++}else if(Q.sc==Q.bs)S.wb+=5}}
else if(k=='duelend')Q=null;
return render()}
const c=e.target.closest('[data-i]');if(c)sheet(c.dataset.i)});
document.addEventListener('input',e=>{if(e.target.id=='q'){F.q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id=='fr'){F.r=e.target.value;render()}if(e.target.id=='ff'){F.f=e.target.checked;render()}});
setInterval(()=>{tick();const t=$('#tm');if(t){const s=Math.max(0,Math.ceil((S.next-Date.now())/1e3));t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}const k=$('#pk');if(T=='boost'&&k&&!busy&&k.textContent!=S.packs+'/10 pochettes')render()},1000);
tick();render();
</script></body></html>
